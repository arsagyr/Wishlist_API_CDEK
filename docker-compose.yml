services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: wishlist-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wishlist-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: wishlist-app
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/mydb?sslmode=disable
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: mydb
      APP_PORT: 8080
      JWT_SECRET: your-secret-key-change-in-production
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wishlist-network

networks:
  wishlist-network:
    driver: bridge

volumes:
  postgres_data: